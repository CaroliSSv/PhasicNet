#microcol_mozafari_cfg - EXPERIMENT FILE of variant B: ExperimentCfg = dynamics + run (PhasicNet.load_experiment; written by save_experiment, a
# re-save drops these comments). Values: Mozafari et al. 2019 Tables 1-3 and the first author's SpykeTorch code (MozafariDeep.py).
#dynamics   one step = one latency bin (dt 1, the paper's time is ordinal); delta synapse (W = the potential jump), non-leaky IF;
#           threshold: L1 15, L2 10, L3 none (null = never fires, the potential is read), one spike per neuron per sample, wta_groups = the layers
#           whose columns compete while they learn; plasticity: STDP a+ 0.004 / a- 0.003 x w (1 - w), a+ doubles every 500 samples up to 0.15
#           (a- = 0.75 a+); R-STDP reward (0.004, 0.003), punishment (0.0005, 0.004), decision weights within [0.2, 0.8]
#run        protocol MOZAFARI (microcol_mozafari_protocol.py): STDP L1 2 epochs, L2 4 epochs, then R-STDP on L2_L3 for rstdp_epochs passes
#           (the authors ran 680), adaptive rates per 1000 samples; 17 steps per sample (15 bins + 2 so the last spikes reach L3);
#           data shuffle false = the source's order (the authors' loader); val_split 1/6 replaces the authors' choice of epoch on the test set
#Any field can be changed per run: main(values={"run.protocol.rstdp_epochs": 5, "dynamics.plasticity.Ar_ltp": 0.002}).
#YAML NOTE: write 0.001 or 1.0e-3, not 1e-3 (PyYAML reads 1e-3 as a string).
cfg_name: microcol_mozafari
cfg_id: 524bc68bd47f4a14
dynamics:
    simulation:
        dt: 1.0
        array_library: numpy
        weights_format: sparse
        update_on: hybrid_event
    synapse:
        b: null
        cfg_type: SynapseCfg
    integrator:
        tau_mem: null
        v_rest: 0.0
        r: 1.0
        cfg_type: IFIntegratorCfg
    threshold:
        v_reset: 0.0
        v_th: 15.0
        tau_th: null
        adpt_th: null
        t_refrac: null
        cfg_type: GroupThresholdCfg
        group_v_th:
            L1_exc: 15.0
            L2_exc: 10.0
            L3_exc: null
        one_spike: true
        wta_groups:
        - L1_exc
        - L2_exc
        wta_dims: 2
    plasticity:
        tau_pretrace: 0.0
        tau_posttrace: 0.0
        A_ltp: 0.004
        A_ltd: 0.003
        eta_exc: 1.0
        eta_inh: null
        w_min: 0.0
        w_max: 1.0
        freeze: []
        cfg_type: MozafariSTDPCfg
        rate_double_every: 500
        A_ltp_max: 0.15
        ltd_ratio: 0.75
        stabilizer: true
        decision_group: L3_exc
        Ar_ltp: 0.004
        Ar_ltd: 0.003
        Ap_ltp: 0.0005
        Ap_ltd: 0.004
        decision_w_min: 0.2
        decision_w_max: 0.8
        kwta:                     # k winners per sample and the blocking radius (columns), per layer: MozafariDeep.py k1 r1 k2 r2  ##authors choice> mozafari
            L1_exc: [5, 3]
            L2_exc: [8, 1]
    noise:
        mu_mem: 0.0
        sigma_mem: 0.0
        cfg_type: NoiseCfg
    phases:
    -   phase_type: DEFAULT
        triggers: {}
        trigger_mode: all
        exit_triggers: null
        dataloader_active: true
run:
    history:
        record_spikes: false
        include_input: false
        record_phase: true
        record_epoch: true
        record_datarun: true
        record_counts: true
        cfg_type: HistoryCfg
        chunk_events: 60000
    scorer:
        rate_hz_max: 500.0
        rate_hz_min: 0.0
        scorer: vrc
        cfg_type: ScorerCfg
    checkpoint:
        select: final
        content: full
        greater_is_better: true
        min_improvement: 0.0
        to_disk: false
        every: null
        keep_last: 3
        cfg_type: CheckpointCfg
    data:
        make_test_split: false
        test_fraction: 0.0
        stratify: true
        n_train: null
        n_test: null
        shuffle: false
        cfg_type: DataCfg
    protocol:
        protocol_type: MOZAFARI
        reset_between_samples: false
        report_every: 500
        epochs: 1
        patience: null
        val_split: 0.16666666666666666
        t_train_ms: 17.0
        t_state_ms: 17.0
        stage_learn:
        -   - in_L1
        -   - L1_L2
        stage_epochs:
        - 2
        - 4
        cluster_groups:
        - L1_exc
        - L2_exc
        vote_group: null
        n_init: 10
        input_control: true
        rate_probe: 200
        trajectory_every: 10000   # every neuron's degrees and strengths every 10000 fit samples of every pass (results.json "trajectory", responses.npz traj)
        rstdp_learn:
        - L2_L3
        rstdp_epochs: 20
        rstdp_batch: 1000
        decision_group: L3_exc
        n_per_class: 20
        phi_init:
        - 1.0
        - 1.0
        select_best_val: true
